version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/**" # root + all Maven submodules
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "com.fasterxml.jackson.core:jackson-annotations"
      - dependency-name: "com.fasterxml.jackson.module:jackson-module-scala_2.12"
      - dependency-name: "com.wcohen.ss:secondstring"
      - dependency-name: "commons-logging:commons-logging"
      - dependency-name: "io.graphframes:graphframes-spark3_2.12"
      - dependency-name: "javax.mail:mail"
      - dependency-name: "org.apache.httpcomponents:httpclient"
      - dependency-name: "org.freemarker:freemarker"
    ignore:
      - dependency-name: "com.fasterxml.jackson.core:jackson-core"
      - dependency-name: "com.fasterxml.jackson.core:jackson-databind"
      - dependency-name: "org.apache.spark:spark-core_*"
      - dependency-name: "org.apache.spark:spark-graphx_*"
      - dependency-name: "org.apache.spark:spark-mllib_*"
      - dependency-name: "org.scala-lang:scala-library"
