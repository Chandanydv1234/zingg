name: dependabot-config

# Ensures .github/dependabot.yml stays in sync with the poms' dependency scopes.
# The file is generated by scripts/gen-dependabot.py; this fails the build if a
# pom changed but the config wasn't regenerated.
on:
  pull_request:
    paths:
      - '**/pom.xml'
      - '.github/dependabot.yml'
      - 'scripts/gen-dependabot.py'
      - '.github/workflows/dependabot-config.yml'
  push:
    branches: [ main ]
    paths:
      - '**/pom.xml'
      - '.github/dependabot.yml'
      - 'scripts/gen-dependabot.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify dependabot.yml matches the poms
        run: python3 scripts/gen-dependabot.py --check
